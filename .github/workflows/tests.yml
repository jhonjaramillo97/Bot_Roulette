name: Tests

on:
  push:
    branches: [main, code_auditor]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r bot_ruleta/requirements.txt

      - name: Run tests
        run: python -m pytest bot_ruleta/tests/ -v --tb=short
